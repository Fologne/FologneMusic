name: music_app
description: Player Android com letras e significados offline.
publish_to: none
version: 2.0.0+15

environment:
  sdk: ^3.13.7

dependencies:
  audio_service: ^0.18.19
  audio_session: ^0.2.4
  crypto: ^3.0.8
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  just_audio: ^0.10.6
  path: ^1.9.1
  sqflite: ^2.4.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: 6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/track_context.json
    - android/app/src/main/res/drawable-nodpi/fologne_launcher_art.png
